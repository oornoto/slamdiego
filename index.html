<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slam Diego</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #002D62;
    --gold: #FFC425;
    --brown: #7B3F00;
  }

  html, body {
    height: 100%;
    background: #fff;
    font-family: 'DM Mono', monospace;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
    position: relative;
  }

  .logo {
    width: auto;
    max-width: min(80vw, 480px);
    height: auto;
    max-height: 80vh;
  }

  .contact {
    margin-top: 32px;
  }

  .contact a {
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--navy);
    text-decoration: none;
    border-bottom: 1px solid var(--navy);
    padding-bottom: 2px;
    transition: color 0.2s, border-color 0.2s;
  }

  .contact a:hover {
    color: var(--brown);
    border-color: var(--gold);
  }

  /* hidden portal link */
  .portal {
    position: fixed;
    bottom: 18px;
    right: 22px;
    font-size: 0.9rem;
    opacity: 0.18;
    transition: opacity 0.3s;
    text-decoration: none;
    cursor: pointer;
    z-index: 10;
    line-height: 1;
  }
  .portal:hover { opacity: 0.7; }
</style>
</head>
<body>
<div class="page">
  <img class="logo" src="/friar-logo.png" alt="Slam Diego friar logo" />

  <div class="contact">
    <a href="mailto:josh@slamdiego.com">josh@slamdiego.com</a>
  </div>
</div>

<a class="portal" href="/dashboard" title="">⚾</a>
</body>
</html>
